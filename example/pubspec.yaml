name: taskchampion_client_example
description: "Example application for TaskChampion client library"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.1
  flutter: ">=3.24.0"

dependencies:
  flutter:
    sdk: flutter
  taskchampion_client_rust:
    path: ../
  provider: ^6.1.5
  intl: ^0.20.3
  flutter_secure_storage: ^10.2.0
  path_provider: ^2.1.5
  file_picker: ^12.0.0
  share_plus: ^13.3.0
  permission_handler: ^13.0.1
  fluttertoast: ^10.0.0
  material_ui: ^1.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
