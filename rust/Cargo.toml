[package]
name = "tc_helper"
version = "0.1.0"
edition = "2021"
description = "Rust FFI bridge for TaskChampion client library"
license = "MIT"

[lib]
crate-type = ["cdylib", "staticlib"]
path = "src/lib.rs"

[dependencies]
flutter_rust_bridge = "=2.13.0"
flutter_rust_bridge_macros = "=2.13.0"
taskchampion = { version = "3.1", default-features = false, features = ["bundled", "storage-sqlite", "server-sync", "server-local", "encryption", "tls-webpki-roots"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync"] }
flate2 = "1"
uuid = { version = "1", features = ["serde", "v4"] }
async-trait = "0.1"
serde_json = "1"
serde = { version = "1", features = ["derive"] }
chrono = { version = "0.4", features = ["serde"] }
anyhow = "1"
thiserror = "2"
regex = "1"
phf = { version = "0.11", features = ["macros"] }

[features]
# Experimental features (enabled via rust_builder.yaml configuration)
experimental = []

[dev-dependencies]
tempfile = "3"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
